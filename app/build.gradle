plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ravena.engine'
    compileSdk 36
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId 'com.ravena.engine'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
